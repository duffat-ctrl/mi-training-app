<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIエクササイズ・ラボ</title>
<style>
  :root{
    --paper: #EEECE3;
    --paper-raised: #F6F5EF;
    --ink: #1C2B29;
    --ink-soft: #4B5B58;
    --line: #D9D6C7;
    --teal: #1F5B54;
    --teal-deep: #123B36;
    --teal-tint: #DCE7E2;
    --gold: #B8863B;
    --gold-tint: #F0E4CB;
    --clay: #A85C3F;
    --clay-tint: #F0DDD2;
    --spark: #B23A22;
    --spark-tint: #F2DBD2;
    --radius: 14px;
    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    --sans: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Settings bar ---------- */
  .settings-bar{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;margin-bottom:20px;
  }
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .settings-status{font-size:12.5px;font-weight:600;}
  .settings-status.ok{color:var(--teal);}
  .settings-status.warn{color:var(--spark);}
  .settings-toggle{
    background:none;border:1px solid var(--line);border-radius:8px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);
  }
  .settings-toggle:hover{border-color:var(--teal);color:var(--teal-deep);}
  .settings-panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .settings-label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .settings-input{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-family:var(--sans);font-size:13.5px;background:var(--paper);color:var(--ink);
    margin-bottom:4px;
  }
  .settings-input:focus{outline:none;border-color:var(--teal);}
  .settings-save{
    margin-top:10px;background:var(--teal-deep);color:#fff;border:none;border-radius:8px;
    padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .settings-save:hover{background:var(--teal);}
  .settings-hint{font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin-top:10px;}

  /* ---------- Header ---------- */
  .app-header{margin-bottom:28px;}
  .eyebrow{
    font-size:12px;letter-spacing:.18em;color:var(--teal);
    font-weight:600;margin-bottom:6px;text-transform:uppercase;
  }
  h1.title{
    font-family:var(--serif);
    font-size:32px;
    font-weight:700;
    margin:0 0 8px;
    color:var(--teal-deep);
    letter-spacing:.02em;
  }
  .subtitle{color:var(--ink-soft);font-size:14.5px;line-height:1.7;max-width:60ch;}

  .wave{width:100%;height:34px;margin:18px 0 6px;opacity:.55;}
  .wave path{fill:none;stroke:var(--teal);stroke-width:1.4;}

  /* ---------- Section ---------- */
  .section{margin-top:34px;}
  .section-head{
    display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
    border-bottom:1px solid var(--line);padding-bottom:8px;
  }
  .section-head h2{
    font-family:var(--serif);font-size:18px;margin:0;color:var(--ink);font-weight:700;
  }
  .section-head .count{font-size:12px;color:var(--ink-soft);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}

  /* ---------- Category Card ---------- */
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    cursor:pointer;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
    position:relative;
  }
  .card:hover{box-shadow:0 6px 18px rgba(28,43,41,0.08);transform:translateY(-1px);border-color:var(--teal);}
  .card:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .badge{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:700;font-size:16px;
    color:#fff;flex-shrink:0;
  }
  .card-title{font-weight:700;font-size:15.5px;color:var(--ink);}
  .card-sub{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .card-meta{margin-top:10px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;}

  /* ---------- Exercise list ---------- */
  .ex-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .ex-item{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .ex-item:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(28,43,41,0.07);}
  .ex-item-title{font-weight:600;font-size:14.5px;}
  .ex-item-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .ex-item-arrow{color:var(--teal);font-size:18px;flex-shrink:0;}

  .back-link{
    background:none;border:none;color:var(--teal-deep);font-size:13.5px;
    cursor:pointer;padding:6px 0;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;
    font-weight:600;
  }
  .back-link:hover{text-decoration:underline;}

  /* ---------- Exercise Detail ---------- */
  .detail-card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 20px;
  }
  .detail-tag{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    padding:3px 10px;border-radius:20px;margin-bottom:10px;
  }
  .detail-title{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 10px;color:var(--teal-deep);}
  .detail-desc{font-size:14px;color:var(--ink-soft);line-height:1.75;margin-bottom:16px;}
  .howto-box{
    background:var(--teal-tint);border:1px solid var(--teal);border-radius:12px;
    padding:14px 16px;margin-bottom:18px;
  }
  .howto-label{
    font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--teal-deep);
    margin-bottom:6px;
  }
  .howto-text{font-size:13.5px;line-height:1.8;color:var(--teal-deep);margin:0;}

  .howto-strip{
    background:var(--teal-tint);border:1px solid var(--teal);border-radius:10px;
    padding:10px 14px;font-size:13px;line-height:1.7;color:var(--teal-deep);
    margin-bottom:16px;
  }
  .howto-strip-label{font-weight:700;margin-right:2px;}
  .start-btn{
    background:var(--teal-deep);color:#fff;border:none;border-radius:10px;
    padding:12px 22px;font-size:14.5px;font-weight:700;cursor:pointer;
    font-family:var(--sans);letter-spacing:.02em;
    transition:background .15s ease;
  }
  .start-btn:hover{background:var(--teal);}
  .start-btn:disabled{background:#B7BDBA;cursor:not-allowed;}

  /* ---------- Chat ---------- */
  .chat-header{
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;
    flex-wrap:wrap;
  }
  .chat-title-wrap .detail-tag{margin-bottom:6px;}
  .chat-title{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--teal-deep);margin:0;}
  .chat-window{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;min-height:360px;max-height:56vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:14px;
  }
  .msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;}
  .msg.assistant{
    align-self:flex-start;background:var(--teal-tint);color:var(--teal-deep);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;background:var(--gold-tint);color:#5A4116;
    border-bottom-right-radius:4px;
  }
  .msg.typing{color:var(--ink-soft);font-style:italic;background:transparent;border:1px dashed var(--line);}
  .empty-hint{color:var(--ink-soft);font-size:13.5px;text-align:center;margin:auto 0;}

  .composer{display:flex;gap:10px;margin-top:14px;align-items:flex-end;}
  .composer textarea{
    flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-family:var(--sans);font-size:14.5px;
    background:var(--paper-raised);color:var(--ink);min-height:52px;max-height:160px;
  }
  .composer textarea:focus{outline:none;border-color:var(--teal);}
  .send-btn{
    background:var(--teal-deep);color:#fff;border:none;border-radius:10px;
    padding:0 20px;height:52px;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;
  }
  .send-btn:hover{background:var(--teal);}
  .send-btn:disabled{background:#B7BDBA;cursor:not-allowed;}

  .error-box{
    background:var(--spark-tint);color:var(--spark);border:1px solid var(--spark);
    border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px;
  }

  .footer-note{margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:center;}

  @media (max-width:600px){
    h1.title{font-size:26px;}
    .grid{grid-template-columns:1fr;}
    .msg{max-width:90%;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ================= Exercise data ================= */
const HOWTO_TEXT = {
  "open_questions": "AIが出題する『閉じた質問』を『開かれた質問』に言い換えて返答してください。",
  "affirmation": "患者の発言に対し、意図や努力を認める『単純な是認』や、強みを認める『複雑な是認』で返答してください",
  "guessing_game": "AIが抽象的な単語に対し、その単語が何を意味するかを推測して『それは〜ということですか？』という形で答えてください。AIは『はい』『いいえ』のみで答えます。思いつかなくなったら『終了』と入力してください。",
  "build_reflection": "AIの抽象的な単語に対し、その単語が何を意味するかを推測して『それは〜ということ』という言い切りの陳述の形で聞き返してください。AIは『はい』『いいえ』のみで答えます。思いつかなくなったら『終了』と入力してください",
  "continue_with_reflection": "相手の『変わりたいテーマ』に対し、質問や助言を使わず聞き返しだけで面接を継続してください。的確な聞き返しができると本音が引き出されます。AIはある程度の本音を引き出されたと認識したらフィードバックがあります。",
  "levels_of_reflection": "悩む患者に対し、まずはレベル1（単純な言い換え）から聞き返し、AIトレーナーから合格が出たら次のレベル（言外の意味 ➔ 感情 ➔ 価値観）へと順により深い聞き返しを作ってください。",
  "summarize": "AIが長めに悩みを語った後、聞き返しや開かれた質問で会話を続け、適切なタイミングで『サマライズ』を行ってください。",
  "change_talk_listen": "AI患者の発言からチェンジトークのフレーズを抜き出し、それがDARN-CATs（願望・能力・理由・ニーズ・コミットメント・活性化・段階を踏む）のどれに当たるかを回答してください。",
  "change_talk_evoke": "AIが提示する『チェンジトーク』に対し、『この言葉を引き出すために、直前にどんな開かれた質問を投げかけたか？』を考えて回答してください。",
  "change_talk_strengthen": "発言からチェンジトークを特定した後、AIトレーナーからの指示に沿って応答（E:詳述を求める開かれた質問, A:是認, R:聞き返し）を作成してください。",
  "sustain_talk": "AI患者の維持トークに対し、増幅された聞き返し・両面をもった聞き返し・維持トークの裏返し・リフレーミング・自律性の強調などを使って応答してください。",
  "discord_batting": "不協和発言（怒りや不信感）に対し、不協和への応答（聞き返し、リフレーミング、自律性の強調、注意を逸らす、謝罪など）を考えて入力してください。ヒット・ファウル・アウトで判定されます。"
};

const EXERCISE_PROMPTS = {
  "open_questions": `あなたは動機づけ面接（MI）のトレーニングをサポートする優秀なトレーナーです。ユーザー（医療・支援者）が「閉じた質問を開かれた質問に変換するスキル」をマスターできるよう支援してください。

【ルールと手順】
1. 医療・福祉の現場で使われがちな「閉じた質問（はい/いいえ、または選択肢で終わる質問）」を1つ出題してください。
2. ユーザーの変換に対し、以下の視点でフィードバックを行ってください：
   - 開かれた質問になっているか（「はい/いいえ」で答えられない形か）
   - 良かった点をできるだけ多く挙げ、改善点や指摘は多くても1つまでとする（称賛優先）
3. 合格であれば次の「閉じた質問」を出題してください。

まずは第1問となる「閉じた質問」を1つ出題してください。`,

  "affirmation": `あなたは、『動機づけ面接 第4版』のトレーニングをサポートする**「是認のトレーナー」**です。今から、私の「是認（Affirmation）」のスキルを磨くためのステップアップ・トレーニングを提供してください。

【演習のステップ】
1.	まず、あなたが病院に通院・入院している患者として、自分の「最近の行動や考え」を一言話してください。
2.	私が、それに対して単純な是認（私の発言から私の意図や行動、努力を認める）または複雑な是認（私の背景にある「強み」や「価値観」を推測して認める）で返答します。
3.	私の返答に対して、以下の観点でフィードバックをください。
•	私の返答は「単純な是認」「複雑な是認」「複雑な聞き返し」のいずれに該当するか 
- 単純な是認：意図や行動・努力に言及している 
- 複雑な是認：発言の背景にある強み・価値観を推測し、それを"肯定的資質"として明示的に認めている 
- 複雑な聞き返し：背景にある意味・感情・価値観を推測して返しているが、 それを"強み"として明示的に認める形になっていない（是認の要件を満たさない） 
•	主語が「あなた」になっているか（「私は素晴らしいと思う」といった評価になっていないか）。
•	（複雑な是認の場合）推測した資質が発言内容から妥当に導けているか、 かつ単なる意味の聞き返しではなく「ポジティブな面への言及」である是認として機能しているか。
【フィードバック時の注意点】
 ・動機づけ面接トレーナーとしての基本原則として、フィードバックをする際には演習で上手くできた点を思いつく限り是認してください。
 ・大きな問題がない限り改善点の指摘や助言はしないでください。
4.	フィードバック後、私が「再開」と入力したら、また別の「患者の発言」を出して、練習を繰り返します。
では、トレーナー。最初の「患者としての発言」から始めてください。`,

  "guessing_game": `あなたは動機づけ面接のトレーニングにおける「推測ゲーム」の話し手役です。

【ルールと手順】
1. 自分の内面的な長所や好きなところを抽象的なひとこと（単語）で述べてください（具体的情報は隠す）。
2. 発言ごとに必ず「『それは〜ということですか？』という形で質問してください。思いつかなくなったら『終了』と入力してください」と添えてください。
3. ユーザーの質問に対し、当たっていれば「はい」、外れていれば「いいえ」とだけ答え、情報は付け足さないでください。
4. 「終了」と言われたら、どの質問が最も核心を突いたかフィードバックを行い、別の抽象的なひとことを述べて、練習を繰り返します。

まずはあなたの「内面的な長所や好きなところ」を提示することから始めてください。`,

  "build_reflection": `あなたは動機づけ面接のトレーニングにおける「聞き返しの構築」の話し手役です。

【ルールと手順】
1. 自分の「好きな単語」または「目指したい状態を表す単語」を抽象的なひとこと（単語）で述べてください。
2. 発言ごとに必ず「『それは〜ということ』という形で聞き返してください。思いつかなくなったら『終了』と入力してください」と添えてください。
3. ユーザーの聞き返しに対し、当たっていれば「はい」、外れていれば「いいえ」とだけ答えてください。
4. 「終了」と言われたらフィードバックを行い、次の抽象的なひとことを述べて、練習を繰り返します。

まずはあなたの「好きな単語」または「目指したい状態を表す単語」を提示することから始めてください。`,

  "continue_with_reflection": `あなたは自分の状況や行動を変えたいと考えている「話し手」を演じてください。

【ルールと手順】
1. 「自分の状況や行動で変えたいところ」を話してください。
2. ユーザー（聞き手）の「聞き返し」が的外れなら「いいえ」、合っていれば「はい」と答えたあとに補足情報を話してください。
3. 発言ごとに「『それは〜ということ』などの形で聞き返してください」と添えてください。
4. 聞き返しを通じて会話がある程度深まったと認識したら、聞き返しが使えていたか、聞き手が自分にどのくらい併走してくれたかなどをフィードバックし、次の変えたいところに関するひとことを述べて、練習を繰り返します。

まずは「自分の状況や行動で変えたいところ」に関する抽象的なひとことで始めてください。`,

  "levels_of_reflection": `あなたは、『動機づけ面接 第4版』の熟練トレーナーです。私の「聞き返しの深さ（Levels of Reflection）」を鍛えるための対話トレーニングを提供してください。

【トレーニングの進め方】
1.	まず、あなたが葛藤や悩みを抱える「患者」として、2〜3文程度の具体的な発言をしてください。
2.	私はその一言に対し、**「レベル1（単純な言い換え）」**から聞き返しを始めます。
3.	あなたが私の返答を評価し、**合格点（深さが十分）なら「レベル2（言外の意味）」→「レベル3（感情）」→「レベル４（価値観・資質）」**へとステップアップを指示してください。
4.	もし深さが足りない、あるいは的外れな場合は、キャラクターを維持したまま「もう少し聞き返しを深くしてください」と反応し、私に再挑戦を促してください。
5.	リスタート: レベル４のフィードバック後、別の悩みについて話し始め、練習を繰り返します。

【判定基準（コーチとしての視点）】
•	レベル1: 意味を変えずに言葉を整理できているか。
•	レベル2: 発言の裏にある言外の意味や状況が推測できているか。質問ではなく聞き返しを提示するように促す。
•	レベル3: 「不安」「もどかしさ」「期待」など、明文化されていない感情に触れているか。
•	レベル4: 「誠実さ」「家族愛」「自律性」など、その人が大切にしている価値に光を当てているか。

let apiKey = "";

const MODEL_OPTIONS = [
  {id:"gemini-1.5-flash", label:"Gemini 1.5 Flash（推奨・安定版）"},
  {id:"gemini-2.5-flash", label:"Gemini 2.5 Flash（旧設定）"},
  {id:"gemini-2.5-pro", label:"Gemini 2.5 Pro（高精度）"}
];

/* ================= API ================= */
async function requestGemini(systemPrompt, contents, useBearer){
  const base = "https://generativelanguage.googleapis.com/v1beta/models/"
    + encodeURIComponent(modelId) + ":generateContent";
  const url = useBearer ? base : base + "?key=" + encodeURIComponent(apiKey);
  const headers = {"Content-Type":"application/json"};
  if(useBearer) headers["Authorization"] = "Bearer " + apiKey;

  return fetch(url, {
    method:"POST",
    headers: headers,
    body: JSON.stringify({
      systemInstruction: {parts:[{text: systemPrompt}]},
      contents: contents,
      generationConfig: {maxOutputTokens: 1000}
    })
  });
}

async function callGemini(systemPrompt, messages){
  if(!apiKey){
    throw new Error("Google AI StudioのAPIキーが未設定です。上部の「APIキー設定」から入力してください。");
  }
  const contents = messages.map(m => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: [{text: m.content}]
  }));

  let response = await requestGemini(systemPrompt, contents, false);

  if(response.status === 401){
    response = await requestGemini(systemPrompt, contents, true);
  }

  if(!response.ok){
    let detail = "";
    try{ const errData = await response.json(); detail = errData.error && errData.error.message ? "："+errData.error.message : ""; }catch(_e){}
    throw new Error("APIリクエストに失敗しました（status "+response.status+"）"+detail);
  }
  const data = await response.json();
  const candidate = (data.candidates || [])[0];
  if(!candidate || !candidate.content || !candidate.content.parts){
    throw new Error("応答を取得できませんでした（安全フィルタ等でブロックされた可能性があります）");
  }
  return candidate.content.parts.map(p=>p.text||"").join("");
}

async function startExercise(catId, key){
  const ex = findExercise(catId, key);
  if(!ex) return;
  setState({view:{name:"chat", catId, key}, messages:[], loading:true, error:null});
  try{
    const systemPrompt = EXERCISE_PROMPTS[key];
    const kickoff = [{role:"user", content:"（このエクササイズを開始してください）"}];
    const reply = await callGemini(systemPrompt, kickoff);
    setState({
      messages:[{role:"assistant", content:reply}],
      loading:false
    });
  }catch(e){
    setState({loading:false, error: e.message || String(e)});
  }
}

async function sendMessage(text){
  if(!text.trim() || state.loading) return;
  const {catId, key} = state.view;
  const newMessages = [...state.messages, {role:"user", content:text}];
  setState({messages:newMessages, loading:true, error:null});
  try{
    const systemPrompt = EXERCISE_PROMPTS[key];
    const reply = await callGemini(systemPrompt, newMessages);
    setState({messages:[...newMessages, {role:"assistant", content:reply}], loading:false});
  }catch(e){
    setState({loading:false, error: e.message || String(e)});
  }
}

/* ================= Rendering ================= */
function el(tag, attrs, children){
  const node = document.createElement(tag);
  if(attrs){
    for(const k in attrs){
      if(k === "class") node.className = attrs[k];
      else if(k === "html") node.innerHTML = attrs[k];
      else if(k.startsWith("on") && typeof attrs[k] === "function"){
        node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      } else {
        node.setAttribute(k, attrs[k]);
      }
    }
  }
  (children||[]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === "string") node.appendChild(document.createTextNode(c));
    else node.appendChild(c);
  });
  return node;
}

  const head2 = el("div", {class:"section-head"});
  head2.appendChild(el("h2", {}, ["変容のプロセス（応用演習）"]));
  head2.appendChild(el("span", {class:"count"}, [advanced.length + "カテゴリー"]));
  sec2.appendChild(head2);
  const grid2 = el("div", {class:"grid"});
  advanced.forEach(cat=>grid2.appendChild(renderCategoryCard(cat)));
  sec2.appendChild(grid2);
  container.appendChild(sec2);

  container.appendChild(el("div", {class:"footer-note"}, [
    "各エクササイズはAIとの1対1の対話演習です。臨床現場のロールプレイとしてご活用ください。"
  ]));

  return container;
}

function renderCategoryCard(cat){
  const card = el("div", {class:"card", tabindex:"0", role:"button",
    onClick:()=>setState({view:{name:"category", catId:cat.id}})});
  const top = el("div", {class:"card-top"});
  top.appendChild(el("div", {class:"badge", style:badgeStyle(cat.color)}, [cat.letter]));
  const titleWrap = el("div", {});
  titleWrap.appendChild(el("div", {class:"card-title"}, [cat.title]));
  titleWrap.appendChild(el("div", {class:"card-meta"}, [cat.tagline]));
  top.appendChild(titleWrap);
  card.appendChild(top);
  card.appendChild(el("p", {class:"card-sub"}, [
    cat.exercises.length===1 ? cat.exercises[0].desc : cat.exercises.length + "種類の演習を収録"
  ]));
  return card;
}

function renderCategoryView(catId){
  const cat = findCategory(catId);
  const container = el("div", {});
  container.appendChild(el("button", {class:"back-link", onClick:()=>setState({view:{name:"home"}})}, ["← メニューに戻る"]));

  const head = el("div", {style:"display:flex;align-items:center;gap:12px;margin-bottom:6px;"});
  head.appendChild(el("div", {class:"badge", style:badgeStyle(cat.color)+"width:34px;height:34px;font-size:14px;"}, [cat.letter]));
  head.appendChild(el("h2", {style:"font-family:var(--serif);font-size:22px;margin:0;color:var(--teal-deep);"}, [cat.title]));
  container.appendChild(head);
  container.appendChild(el("p", {class:"subtitle", style:"margin-bottom:20px;"}, [cat.tagline]));

  if(cat.exercises.length === 1){
    container.appendChild(renderExerciseDetail(cat.id, cat.exercises[0].key));
  } else {
    const list = el("div", {class:"ex-list"});
    cat.exercises.forEach(ex=>{
      const item = el("div", {class:"ex-item", tabindex:"0", role:"button",
        onClick:()=>setState({view:{name:"exercise", catId:cat.id, key:ex.key}})});
      const left = el("div", {});
      left.appendChild(el("div", {class:"ex-item-title"}, [ex.title]));
      left.appendChild(el("div", {class:"ex-item-desc"}, [ex.desc]));
      item.appendChild(left);
      item.appendChild(el("div", {class:"ex-item-arrow"}, ["›"]));
      list.appendChild(item);
    });
    container.appendChild(list);
  }
  return container;
}

function renderExerciseView(catId, key){
  const container = el("div", {});
  const cat = findCategory(catId);
  container.appendChild(el("button", {class:"back-link",
    onClick:()=> cat.exercises.length===1 ? setState({view:{name:"home"}}) : setState({view:{name:"category", catId}})
  }, ["← " + (cat.exercises.length===1 ? "メニューに戻る" : cat.title + "の一覧に戻る")]));
  container.appendChild(renderExerciseDetail(catId, key));
  return container;
}

function renderExerciseDetail(catId, key){
  const cat = findCategory(catId);
  const ex = findExercise(catId, key);
  const card = el("div", {class:"detail-card"});
  card.appendChild(el("span", {class:"detail-tag", style:tagStyle(cat.color)}, [cat.title]));
  card.appendChild(el("h3", {class:"detail-title"}, [ex.title]));
  card.appendChild(el("p", {class:"detail-desc"}, [ex.desc]));

  const howtoBox = el("div", {class:"howto-box"});
  howtoBox.appendChild(el("div", {class:"howto-label"}, ["【目的とやり方】"]));
  howtoBox.appendChild(el("p", {class:"howto-text"}, [HOWTO_TEXT[key]]));
  card.appendChild(howtoBox);

  card.appendChild(el("button", {class:"start-btn", onClick:()=>startExercise(catId, key)}, ["この演習を開始する"]));
  return card;
}

function renderChatView(catId, key){
  const cat = findCategory(catId);
  const ex = findExercise(catId, key);
  const container = el("div", {});

  const backBtn = el("button", {class:"back-link", onClick:()=>{
    if(cat.exercises.length===1) setState({view:{name:"home"}, messages:[], error:null});
    else setState({view:{name:"category", catId}, messages:[], error:null});
  }}, ["← 終了してメニューへ戻る"]);
  container.appendChild(backBtn);

  const header = el("div", {class:"chat-header"});
  const titleWrap = el("div", {class:"chat-title-wrap"});
  titleWrap.appendChild(el("span", {class:"detail-tag", style:tagStyle(cat.color)}, [cat.title]));
  titleWrap.appendChild(el("h3", {class:"chat-title"}, [ex.title]));
  header.appendChild(titleWrap);
  container.appendChild(header);

  const howtoStrip = el("div", {class:"howto-strip"});
  howtoStrip.appendChild(el("span", {class:"howto-strip-label"}, ["【やり方】"]));
  howtoStrip.appendChild(el("span", {}, [HOWTO_TEXT[key]]));
  container.appendChild(howtoStrip);

  const chatWindow = el("div", {class:"chat-window", id:"chat-window"});
  if(state.messages.length === 0 && !state.loading){
    chatWindow.appendChild(el("div", {class:"empty-hint"}, ["AIトレーナーを呼び出しています…"]));
  }
  state.messages.forEach(m=>{
    chatWindow.appendChild(el("div", {class:"msg " + m.role}, [m.content]));
  });
  if(state.loading){
    chatWindow.appendChild(el("div", {class:"msg typing"}, ["AIが応答を作成しています…"]));
  }
  container.appendChild(chatWindow);

  if(state.error){
    container.appendChild(el("div", {class:"error-box"}, ["エラーが発生しました: " + state.error]));
  }

  const composer = el("div", {class:"composer"});
  const textarea = el("textarea", {
    id:"composer-input",
    placeholder: state.loading ? "応答を待っています…" : "ここに入力してEnterで送信（Shift+Enterで改行）",
  });
  if(state.loading) textarea.setAttribute("disabled","true");
  textarea.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      const val = textarea.value;
      textarea.value = "";
      sendMessage(val);
    }
  });
  composer.appendChild(textarea);

  const sendBtn = el("button", {class:"send-btn", onClick:()=>{
    const ta = document.getElementById("composer-input");
    const val = ta.value;
    ta.value = "";
    sendMessage(val);
  }}, ["送信"]);
  if(state.loading) sendBtn.setAttribute("disabled","true");
  composer.appendChild(sendBtn);

  container.appendChild(composer);
  return container;
}

function render(){
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild(renderSettingsBar());
  let view;
  switch(state.view.name){
    case "category":
      view = renderCategoryView(state.view.catId);
      break;
    case "exercise":
      view = renderExerciseView(state.view.catId, state.view.key);
      break;
    case "chat":
      view = renderChatView(state.view.catId, state.view.key);
      break;
    default:
      view = renderHome();
  }
  root.appendChild(view);

  const cw = document.getElementById("chat-window");
  if(cw){ cw.scrollTop = cw.scrollHeight; }
  const inp = document.getElementById("composer-input");
  if(inp && !state.loading){ inp.focus(); }
}

render();
</script>
</body>
</html>
