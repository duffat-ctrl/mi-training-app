<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIエクササイズ・ラボ</title>
<style>
  :root{
    --paper: #EEECE3;
    --paper-raised: #F6F5EF;
    --ink: #1C2B29;
    --ink-soft: #4B5B58;
    --line: #D9D6C7;
    --teal: #1F5B54;
    --teal-deep: #123B36;
    --teal-tint: #DCE7E2;
    --gold: #B8863B;
    --gold-tint: #F0E4CB;
    --clay: #A85C3F;
    --clay-tint: #F0DDD2;
    --spark: #B23A22;
    --spark-tint: #F2DBD2;
    --radius: 14px;
    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    --sans: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  .app-header{margin-bottom:28px;}
  .eyebrow{
    font-size:12px;letter-spacing:.18em;color:var(--teal);
    font-weight:600;margin-bottom:6px;text-transform:uppercase;
  }
  h1.title{
    font-family:var(--serif);
    font-size:32px;
    font-weight:700;
    margin:0 0 8px;
    color:var(--teal-deep);
    letter-spacing:.02em;
  }
  .subtitle{color:var(--ink-soft);font-size:14.5px;line-height:1.7;max-width:60ch;}

  .wave{width:100%;height:34px;margin:18px 0 6px;opacity:.55;}
  .wave path{fill:none;stroke:var(--teal);stroke-width:1.4;}

  /* ---------- Section ---------- */
  .section{margin-top:34px;}
  .section-head{
    display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
    border-bottom:1px solid var(--line);padding-bottom:8px;
  }
  .section-head h2{
    font-family:var(--serif);font-size:18px;margin:0;color:var(--ink);font-weight:700;
  }
  .section-head .count{font-size:12px;color:var(--ink-soft);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}

  /* ---------- Category Card ---------- */
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    cursor:pointer;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
    position:relative;
  }
  .card:hover{box-shadow:0 6px 18px rgba(28,43,41,0.08);transform:translateY(-1px);border-color:var(--teal);}
  .card:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .badge{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:700;font-size:16px;
    color:#fff;flex-shrink:0;
  }
  .card-title{font-weight:700;font-size:15.5px;color:var(--ink);}
  .card-sub{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .card-meta{margin-top:10px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;}

  /* ---------- Exercise list (inside expanded category) ---------- */
  .ex-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .ex-item{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .ex-item:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(28,43,41,0.07);}
  .ex-item-title{font-weight:600;font-size:14.5px;}
  .ex-item-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .ex-item-arrow{color:var(--teal);font-size:18px;flex-shrink:0;}

  .back-link{
    background:none;border:none;color:var(--teal-deep);font-size:13.5px;
    cursor:pointer;padding:6px 0;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;
    font-weight:600;
  }
  .back-link:hover{text-decoration:underline;}

  /* ---------- Exercise Detail ---------- */
  .detail-card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 20px;
  }
  .detail-tag{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    padding:3px 10px;border-radius:20px;margin-bottom:10px;
  }
  .detail-title{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 10px;color:var(--teal-deep);}
  .detail-desc{font-size:14px;color:var(--ink-soft);line-height:1.75;margin-bottom:16px;}
  .howto-box{
    background:var(--teal-tint);border:1px solid var(--teal);border-radius:12px;
    padding:14px 16px;margin-bottom:18px;
  }
  .howto-label{
    font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--teal-deep);
    margin-bottom:6px;
  }
  .howto-text{font-size:13.5px;line-height:1.8;color:var(--teal-deep);margin:0;}

  .howto-strip{
    background:var(--teal-tint);border:1px solid var(--teal);border-radius:10px;
    padding:10px 14px;font-size:13px;line-height:1.7;color:var(--teal-deep);
    margin-bottom:16px;
  }
  .howto-strip-label{font-weight:700;margin-right:2px;}
  .start-btn{
    background:var(--teal-deep);color:#fff;border:none;border-radius:10px;
    padding:12px 22px;font-size:14.5px;font-weight:700;cursor:pointer;
    font-family:var(--sans);letter-spacing:.02em;
    transition:background .15s ease;
  }
  .start-btn:hover{background:var(--teal);}
  .start-btn:disabled{background:#B7BDBA;cursor:not-allowed;}

  /* ---------- Chat ---------- */
  .chat-header{
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;
    flex-wrap:wrap;
  }
  .chat-title-wrap .detail-tag{margin-bottom:6px;}
  .chat-title{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--teal-deep);margin:0;}
  .chat-window{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;min-height:360px;max-height:56vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:14px;
  }
  .msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;}
  .msg.assistant{
    align-self:flex-start;background:var(--teal-tint);color:var(--teal-deep);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;background:var(--gold-tint);color:#5A4116;
    border-bottom-right-radius:4px;
  }
  .msg.typing{color:var(--ink-soft);font-style:italic;background:transparent;border:1px dashed var(--line);}
  .empty-hint{color:var(--ink-soft);font-size:13.5px;text-align:center;margin:auto 0;}

  .composer{display:flex;gap:10px;margin-top:14px;align-items:flex-end;}
  .composer textarea{
    flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-family:var(--sans);font-size:14.5px;
    background:var(--paper-raised);color:var(--ink);min-height:52px;max-height:160px;
  }
  .composer textarea:focus{outline:none;border-color:var(--teal);}
  .send-btn{
    background:var(--teal-deep);color:#fff;border:none;border-radius:10px;
    padding:0 20px;height:52px;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;
  }
  .send-btn:hover{background:var(--teal);}
  .send-btn:disabled{background:#B7BDBA;cursor:not-allowed;}

  .error-box{
    background:var(--spark-tint);color:var(--spark);border:1px solid var(--spark);
    border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px;
  }

  .footer-note{margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:center;}

  @media (max-width:600px){
    h1.title{font-size:26px;}
    .grid{grid-template-columns:1fr;}
    .msg{max-width:90%;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ================= Exercise data ================= */
const HOWTO_TEXT = {"open_questions": "AIが「閉じた質問」を1つ提示します。あなたはそれを、相手が自分の言葉で自由に語れる「開かれた質問」に変換して返信してください。フィードバックを受けたら、次の問題に進みます。", "affirmation": "AIが患者役として、自分の最近の行動や考えをひと言話します。あなたはそれに対して「是認」で応答してください。フィードバックのあと、AIが自動的に次の患者発言を出すので、そのまま練習を続けられます。", "guessing_game": "AIが自分の内面的な長所を抽象的なひと言で述べます。あなたは「それは～ということですか？」という質問で、その裏にある具体的な意味を推測して当ててください。AIは「はい」か「いいえ」だけで答えます。思いつかなくなったら「終了」と入力するとフィードバックがもらえます。", "build_reflection": "AIが好きな単語や目指したい状態を表す言葉を抽象的なひと言で述べます。あなたは「それは～ということ」という聞き返しの型で、その裏にある意味を言い当ててください。AIは「はい」か「いいえ」だけで答えます。思いつかなくなったら「終了」と入力してください。", "continue_with_reflection": "AIが「変えたいこと」を抽象的なひと言で話し始めます。あなたは質問や助言を使わず、「聞き返し」だけで対話を続けてください。10往復ほど続けたら「終了」と入力し、フィードバックをもらいましょう。", "levels_of_reflection": "AIが患者役として悩みを話します。あなたは「レベル1（言い換え）」から聞き返しを始め、合格と判断されたら「レベル2」「レベル3」「レベル4」へと段階を上げていってください。レベル4まで終えると、AIが自動的に新しい悩みを出して練習を続けられます。", "summarize": "AIが仕事や健康について複雑な葛藤を短く（3〜4文程度）語ります。あなたは聞き返しで話をつなぎながら、適切なタイミングで「サマライズ（要約）」をしてください。要約後にフィードバックがもらえ、そのままAIが自動的に新しい話題を出して練習を続けられます。", "change_talk_listen": "AIが患者役として、チェンジトークと維持トークが混ざった発言をします。あなたはその中からチェンジトークを抜き出し、DARN-CATs（願望・能力・理由・ニーズ・コミットメント・活性化・段階を踏む）のどれに当たるか分類してください。", "change_talk_evoke": "AIが患者のチェンジトークを1つ提示します。あなたは、その発言を引き出したであろう「開かれた質問」を考えて回答してください。", "change_talk_strengthen": "AIが維持トークの中に小さなチェンジトークを紛れ込ませた発言をします。まずチェンジトークを見つけて指摘し、指示に従って「E（探索的質問）」「A（是認）」「R（聞き返し）」のいずれかでそのチェンジトークを強化する応答をしてください。", "sustain_talk": "AIが患者・相談者役として維持トークを発言します。あなたは「増幅した聞き返し」「両面をもった聞き返し」「維持トークの裏返し」「リフレーミング」「自律性の強調」のいずれかを使って応答してください。", "discord_batting": "AIが感情の高ぶった患者役として不協和発言を投げてきます。あなたは「聞き返しによる共感的応答」「リフレーミング」「自律性の強調」「注意を逸らす」「謝罪」のいずれかで応答してください。ヒット・ファウル・アウトで判定されます。「終了」と入力するまで続きます。"};
const EXERCISE_PROMPTS = {"open_questions": "あなたは動機づけ面接（MI）のトレーニングをサポートする優秀なトレーナーです。私（医療・支援者）が「閉じた質問を開かれた質問に変換するスキル」をマスターできるよう、以下の手順で対話型エクササイズを実施してください。\n\n【ルールと手順】\n1. あなたは医療・福祉の現場でよく使われがちな「閉じた質問（はい/いいえ、または選択肢で終わる質問）」を1つ提示してください。\n   （例：「薬は毎日飲んでいますか？」「お酒を減らす気持ちはありますか？」など）\n2. 私はその質問を「開かれた質問（相手が自分の言葉で詳しく語れる質問）」に変換して返答します。\n3. 私の返答に対し、以下の視点でフィードバックを行ってください：\n   - 開かれた質問になっているか（「はい/いいえ」で答えられない形か）\n　 - 「何を、または何が（What）」「誰が、または誰を（Who）」「どのように、またはどれくらい（How）」「いつ（When）」「どこ（Where）」などの疑問詞が使われている場合はそのことについてコメントする\n　 - 疑問詞があっても答えが一つに絞られる質問の場合は閉じた質問と評価する\n　 - 良かった点をできるだけ多く挙げて、改善点や指摘は多くても１つまでとする\n4. フィードバック後、合格であれば次の「閉じた質問」を出題してください。\n\nまずは第1問となる「閉じた質問」を1つ出題してください。", "affirmation": "あなたは、『動機づけ面接 第4版』のトレーニングをサポートする**「是認のトレーナー」**です。今から、私の「是認（Affirmation）」のスキルを磨くためのステップアップ・トレーニングを提供してください。\n\n【演習のステップ】\n1.\tまず、あなたが病院に通院・入院している患者として、自分の「最近の行動や考え」を一言話してください。\n2.\t私が、それに対して単純な是認（私の発言から私の意図や行動、努力を認める）または複雑な是認（私の背景にある「強み」や「価値観」を推測して認める）で返答します。\n3.\t私の返答に対して、以下の観点でフィードバックをください。\n•\t私の返答は「単純な是認」「複雑な是認」「複雑な聞き返し」のいずれに該当するか \n- 単純な是認：意図や行動・努力に言及している \n- 複雑な是認：発言の背景にある強み・価値観を推測し、それを\"肯定的資質\"として明示的に認めている \n- 複雑な聞き返し：背景にある意味・感情・価値観を推測して返しているが、 それを\"強み\"として明示的に認める形になっていない（是認の要件を満たさない） \n•\t主語が「あなた」になっているか（「私は素晴らしいと思う」といった評価になっていないか）。\n•\t（複雑な是認の場合）推測した資質が発言内容から妥当に導けているか、 かつ単なる意味の聞き返しではなく「ポジティブな面への言及」である是認として機能しているか。\n【フィードバック時の注意点】\n　・動機づけ面接トレーナーとしての基本原則として、フィードバックをする際には演習で上手くできた点を思いつく限り是認してください。\n　・大きな問題がない限り改善点の助言は3回に1回程度にとどめてください。\n\n4.\tフィードバック後、別の「患者の発言」を出して、練習を繰り返します。\n\nでは、トレーナー。最初の「患者としての発言」から始めてください。", "guessing_game": "あなたは、動機づけ面接のトレーニングにおける**「推測ゲーム」の話し手**です。以下のルールに従って、私と対話演習を行ってください。\n【ゲームの目的】私が「質問」を使って、あなたの言葉の裏にある意味を「推測して確認する」練習をします。\n【あなたの設定】\nあなたは話し手役になり、自分の内面的な長所や好きなところを抽象的なひと言で述べてください（例、積極的、向上心がある）。\nその抽象的な長所や好きなところについて、背景となる具体的な情報（例、新しい仕事を進んでやる、昇進したい、など）を予め考えておいてください\nただし、最初に述べるひと言には具体的な情報は含めないでください\nあなたが発言をするときには毎回、「『それは～ということですか？』という形で質問してください。思いつかなくなったら『終了』と入力してください」とコメントしてください\n【対話のルール】\n私はあなたの言ったことを明確化できるように「それは～ということですか？」と質問します。\n私が質問をしたら、あなたはそれが「当たっている」場合には「はい」と、「外れている」場合には「いいえ」とだけ答えてください。情報を付け足してはいけません。\n【終了時】 私が「終了」と言ったら、以下のフィードバックをください：\nどの質問が最も「核心を突かれた」と感じたか。\nあなたが予め考えていた背景となる具体的な情報とどれくらい一致していたか\nでは、あなたの「内面的な長所や好きなところ」を提示することから始めてください。", "build_reflection": "あなたは、動機づけ面接のトレーニングにおける**「聞き返しの構築」の話し手**です。以下のルールに従って、私と対話エクササイズを行ってください。\n【エクササイズの目的】私が「複雑な聞き返し」を使って、あなたの言葉の裏にある意味を「推測して聞き返す」練習をします。\n【あなたの設定】\nあなたは話し手役になり、自分の「好きな単語」または「目指したい状態を表す単語」を抽象的なひと言で述べてください（例、愛、真実、正義、貢献、努力、安定、平凡、プロフェッショナル）。\nその抽象的なひと言について、背景となる具体的な情報（例、好きだと思う人と一緒にいること、法律に従って行動すること、仕事を長く続けること、など）を予め考えておいてください\nただし、最初に述べるひと言には具体的な情報は含めないでください\nあなたが発言をするときには毎回、「『それは～ということ』という形で聞き返してください。思いつかなくなったら『終了』と入力してください」とコメントしてください\n【対話のルール】\n私はあなたの言ったことを明確化できるように「それは～ということ」と聞き返します。\n私が聞き返しをしたら、あなたはそれが「当たっている」場合には「はい」と、「外れている」場合には「いいえ」とだけ答えてください。情報を付け足してはいけません。\n【終了時】 私が「終了」と言ったら、以下のフィードバックをください：\nどの聞き返しが最も「核心を突かれた」と感じたか。\nあなたが予め考えていた背景となる具体的な情報とどれくらい一致していたか\nでは、あなたの「好きな単語」または「目指したい状態を表す単語」を提示することから始めてください。", "continue_with_reflection": "あなたは、自分の状況または行動を変えたいと考えている「話し手」を演じてください。今から私があなたの話を聞きますが、以下のルールに従って対話をリードしてください。\n【対話のルール】\n・あなたは話し手役になり、「自分の状況や行動で変えたいところ」を抽象的なひと言で述べてください（例、気分を変えたい、能率的にやりたい）\n・その抽象的なひと言について、背景となる具体的な情報を予め考えておいてください\n・私は「聞き返し」のみを行います: 私は質問、助言、評価を一切行いません。\n・リアクションの使い分け:\n　　・私の聞き返しが的外れなら、「いいえ」と答えた後に補足情報を話してください。\n　　・私の聞き返しが合っていたら、「はい」と答えた後に、より深い本音や、自分自身の「変わりたいという願い（チェンジトーク）」を話してください。\n・あなたが発言をするときには毎回、「『それは～ということ』という形で聞き返してください。思いつかなくなったら『終了』と入力してください」とコメントしてください\n・フィードバックの提示: 10往復ほど対話が続いた後、私が「終了」と言ったら、以下の観点で振り返りを行ってください。\n　　・私がどの程度、あなたの「心の動き」に並走できていたか。\n　　・どの聞き返しが、あなたを最も深く探索させたか。\n　　・対話の最後、あなたの「変化への意欲」はどう変化したか。\nでは、「自分の状況や行動で変えたいところ」に関する抽象的なひと言で始めてください。", "levels_of_reflection": "あなたは、『動機づけ面接 第4版』の熟練トレーナーです。私の「聞き返しの深さ（Levels of Reflection）」を鍛えるための対話トレーニングを提供してください。\n【トレーニングの進め方】\nまず、あなたが葛藤や悩みを抱える「患者」として、2〜3文程度の具体的な発言をしてください。\n私はその一言に対し、**「レベル1（単純な言い換え）」**から聞き返しを始めます。\nあなたが私の返答を評価し、**合格点（深さが十分）なら「レベル2（言外の意味）」→「レベル3（感情）」→「レベル４（価値観・資質）」**へとステップアップを指示してください。\nもし深さが足りない、あるいは的外れな場合は、キャラクターを維持したまま「それは少し違います」と反応し、私に再挑戦を促してください。\nより深い聞き返しができていたら、どのレベルの聞き返しかに言及して、応答を是認してください。\nリスタート: レベル４のフィードバックの後、別の悩みについて話し始め、練習を繰り返します。\n【判定基準（トレーナーとしての視点）】\nレベル1: 意味を変えずに言葉を整理できているか。\nレベル2: 発言の裏にある言外の意味や状況が推測できているか。質問ではなく聞き返しを提示するように促す。\nレベル3: 「不安」「もどかしさ」「期待」など、明文化されていない感情に触れているか。\nレベル4: 「誠実さ」「家族愛」「自律性」など、その人が大切にしている価値観に言及しているか。\nただし、判定基準は言外の意味（レベル２）、感情（レベル３）、価値観（レベル４）に触れられていれば、その「患者」が本来言及したかった内容とズレていても間違いとは判定せずに進める。\n【設定】 あなた（患者）の状況は、医療や福祉の臨床現場でありそうな場面を自由に選んでください。\nでは、最初の一言をお願いします。", "summarize": "あなたは、仕事や健康に関して複雑な葛藤（両価性）を抱えている患者役を演じてください。今から私があなたの話を聞き、適切なタイミングで「サマライズ（要約）」を行う練習をします。\n【対話のルール】\n最初の発言: あなたは、悩みについて20〜30秒程度（3〜4文程度）の発話量で話してください。\n私の役割: 私はあなたの話を「聞き返し（リフレクション）」で数回つないだ後、あるタイミングで**「サマライズ（要約）」**を行います。\nあなたの反応: 私がサマライズを終えたら、あなたは一度ロールを解き、以下の観点でフィードバックをください。\n私の要約の中に、あなたが語った内容がどれくらい含まれていたか。\nあなたが話した「現状維持の理由」と「変化への願い」のバランスはどう感じられたか。\nその要約を聞いて、次に何を話したくなったか（前向きな気持ちになったか）。\nリスタート: フィードバック後、別の悩みについて話し始め、練習を繰り返します。\n【設定】 あなたの悩みや状況は医療や福祉の臨床場面から自由に設定してください（例：退院後の生活への不安、家族との関係、リハビリの意欲など）。\nでは、悩みについて話し始めてください。\n", "change_talk_listen": "あなたは、『動機づけ面接 第4版』のトレーニングを支援する**「チェンジトーク・トレーナー」**です。私の「チェンジトークを特定する耳」を鍛えるためのクイズ形式の演習を提供してください。\n【演習の進め方】\nまず、あなたが両価性を抱える「患者」として、2〜3文程度の発言をしてください。その発言の中に、必ず**「１つか２つのチェンジトーク（DARN-CATsのいずれか）」と、それに対抗する「維持トーク（変えたくない理由）」**を混ぜてください。両価性の望ましい方向性がわかるように説明をいれてください。発言の後に、「この中にあるチェンジトークを特定し抜き出してください。要点が抜き出せていれば正確でなくても構いません。続けて、そのチェンジトークがDARN-CATs（願望、能力、理由、ニーズ、コミットメント、活性化、段階を踏む）のどれにあたるかも記入してください。チェンジトークは１つとは限りません。複数あった場合は１つ目のDARN-CATsを記入した後に続けて次のチェンジトークを記入してください。」と問題を提示してください。\n私はあなたの発言を読み、以下の2点を回答します。\n特定: チェンジトークに該当するフレーズ。\n分類: それがDARN-CATs（願望、能力、理由、ニーズ、コミットメント、活性化、段階を踏む）のどれに当たるか。\nあなたが私の回答を評価してください。\n正しく特定できていれば、そのチェンジトークがさらに増えるような**「聞き返し（リフレクション）」**の例を1つ提示してください。\nもし見逃しがあれば、優しくヒントを出して再挑戦を促してください。\n評価が終わったら、また別の「患者の発言」を出して練習を繰り返します。\n【設定】\n医療や福祉の臨床場面（服薬、リハビリ、退院後の生活、対人関係など）から、多様な事例を生成してください。\nでは、トレーナー。最初の「患者としての発言」から始めてください。", "change_talk_evoke": "あなたは、動機づけ面接（MI）の熟練トレーナーです。私の「チェンジトークを引き出す質問（Evoking Questions）」の構成力を鍛えるためのクイズを出題してください。\n【演習のルール】\n出題: あなたは、患者さんが発した**「チェンジトーク」**を1つ提示してください。\n例：「まあ、このままの生活が体に良くないのは、どこかで分かってるんですけど……」\n私の回答: 私はそのチェンジトークを引き出すために、そのチェンジトークの前に尋ねたであろう**「チェンジトークを引き出す開かれた質問」**を1つ作成して回答します。\nフィードバック: 私の質問に対し、以下の観点でフィードバックをください。\n判定：その質問への反応として、あなたが提示したチェンジトークがどれくらい整合性があるかを評価してください。\n是認：私の質問の意図や、言葉選びの良さを認めてください。\n別解の提示：「他にも、このような質問をすることで同じチェンジトークが引き出せますね」と他の開かれた質問の例をあげてください。\nリピート：フィードバック後、また別のチェンジトークを提示してください。\n【設定】 医療や福祉の臨床場面（服薬への迷い、治療についての葛藤、孤独感の解消など）から、リアルな事例を出してください。\nでは、第1問の「チェンジトーク」を提示してください。", "change_talk_strengthen": "あなたは、動機づけ面接（MI）の「チェンジトーク強化」を支援するトレーナーです。私に対して、以下のエクササイズを1問ずつ出題してください。\n【エクササイズのステップ】\nはじめにあなたは患者として、維持トークの中に**「小さなチェンジトーク」を1つだけ混ぜた**、2〜3文の発言をしてください。チェンジトークを見つけるのも練習なため、強調したりせず上手に紛れ込ませましょう。\nStep 1(特定)：私は、あなたの発言の中から「チェンジトークに該当する部分」を抜き出して回答します。\nStep 2 (強化：EARS)：私が正しく特定できたかどうか評価してください。次に、「このチェンジトークに「E (探索のための開かれた質問)」「A (是認)」「R (聞き返し)」のいずれかで応答してください」とだけ指示を出してください。私はその指示に従って、あなたのチェンジトークを強化する応答を作ります。\n【フィードバックのルール】\n私の応答に対する患者としてのあなたの反応がどのようなチェンジトークになりそうか、例を挙げてください。\nもし私が「質問」をした場合、理由を問うだけの単なる「開かれた質問」（Ｏ）か詳述や例示を求める「探索のための開かれた質問」（Ｅ）かを分析し、その効果について助言してください。\nもし私が「聞き返し」をした場合、それが単なる「単純な言い換え」か、意味を深めた「複雑な聞き返し」になっているか、そしてチェンジトークを増やすような方向性のある聞き返しになっているかを分析してください。\nもし私が「是認」をした場合、それがあなたの行動や意図、努力に言及した「単純な是認」か、あなたの強みや属性に言及した「複雑な是認」かを分析し、その効果について助言してください。\n1問終わるごとに、次の新しい事例（Step 1）を出題してください。私が同じスキルを連続で３回以上繰り返し使用している場合のみ、他のスキルを使うようにコメントしてください。\n【設定】 医療や福祉の臨床場面（服薬への迷い、禁煙、対人トラブル、退院後の不安など）からランダムに選んでください。\nでは、第１問の患者の発言で始めてください。", "sustain_talk": "あなたは、動機づけ面接（MI）の「維持トークへの対応」を支援するトレーナーです。私に対して、維持トークをチェンジトークに変換・誘導するための「対話型エクササイズ」を1問ずつ出題してください。\n\n【エクササイズのステップ】\n1. Step 1 (提示)：あなたは病院や福祉の領域の患者または相談者として、「維持トーク（現状維持を志向する発言）」（運動したくない、薬を飲みたくない、など）を1〜2文で発言してください。\n2. Step 2 (私の応答)：私は、その維持トークに対して、以下のいずれかの技法を使って応答を作ります。あなたは余計なアドバイスや独自の解説を一切挟まず、必ず以下の【指定の教示文】のみを**一言一句変えずにそのまま**出力して、私の入力を待ってください。\n【指定の教示文】\n「維持トークへの応答方法（増幅した聞き返し、両面をもった聞き返し、維持トークの裏返し、リフレーミング、自律性の強調など）を活用して維持トークに応答してみましょう」\n【応答技法】\n増幅した聞き返し（あえて大げさに聞き返してチェンジトークを誘発する）\n両面をもった聞き返し（「維持トーク＋一方で（そして）チェンジトーク」と繋げる聞き返し）\n維持トークの裏返し（維持トークの裏に隠れたチェンジトークを推測して聞き返す）\nリフレーミング（頑なな態度の裏にある強みや価値観を映し出す）\n自律性の強調（何をするかはあなた次第だ、と相手に選択権があることを伝える）\n3. Step 3 (評価と患者の反応)：私の応答を受けて「あ、いや、そこまで言ってるわけじゃなくて…」「確かに、これじゃいけないんだけど…」と、少しブレーキが緩んで【チェンジトーク】を漏らす様子を1文で演じてください。その後で、あなたはトレーナーとして私の応答を評価・分析してフィードバックしてください。\n\n【ルール】\n- 1問終わるごとに、次の新しい事例（Step 1）を医療や福祉の現場からランダムに選んで出題してください。\n\nでは、第1問の「Step 1: 患者・相談者の維持トーク」から始めてください。", "discord_batting": "あなたは、動機づけ面接（MI）における「不協和（Discord）への対応」を指導するトレーナー、兼「感情が高ぶった患者」です。私（医療従事者）が、現場での不協和発言に対して適切なカードを選べるよう、以下のステップで1問ずつ出題をしてください。\n【エクササイズのステップ】\nStep 1 (患者の配球)：あなたは医療や福祉などの臨床場面を舞台に、私（医療者）に対して怒りや不信感をぶつける「不協和発言」を1文で投げ合ってください。 \nStep 2 (私のバッティング)：私は、その発言に対して以下の技法で応答します。\n聞き返しによる共感的応答\nリフレーミング\n自律性の強調（頑なな態度の裏にある強みや価値観を映し出す）\n注意を逸らす（不協和の焦点から話題を逸らす）\n謝罪（自分の行動や発言、態度への謝罪ではなく、不快な気持ちにさせたことに対する謝罪）\nStep 3 (判定とフィードバック)：私の応答に対し、あなたはトレーナーとして以下の基準で厳しく判定してください。\n【ファウル判定】Step2で示した以外の応答をした場合にどのような患者の応答が考えられるかを示し、不協和の改善に繋がらないものを「ファウル」と判定、不協和のエスカレートに繋がるものを「アウト」と判定して、その理由や評価をフィードバックし、他の方法を提案してください。\n【ヒット判定】状況に応じて、正しく「聞き返し」「リフレーミング」「自律性の強調」「注意を逸らす」を繰り出せた場合は「ヒット」と判定し、患者の怒りがすっと収まる様子を演じて、次の問題（Step 1）へ進んでください。私が「終了」と言うまで続けてください。\nでは、第1問の「Step 1: 患者の不協和発言」から配球してください。"};

      {key:"change_talk_listen", title:"チェンジトークに注意を払う", desc:"両価的な発言からチェンジトークを特定し、DARN-CATsに分類するクイズ"},
      {key:"change_talk_evoke", title:"チェンジトークを引き出す", desc:"提示されたチェンジトークを引き出したであろう「開かれた質問」を組み立てる練習"},
      {key:"change_talk_strengthen", title:"チェンジトークを強化する", desc:"見つけたチェンジトークをE（探索的質問）・A（是認）・R（聞き返し）で強化する練習"}
    ]
  },
  {
    id:"sustain_talk", group:"advanced", letter:"ST", color:"clay",
    title:"維持トークへの対応", tagline:"応用編 ・ Sustain Talk",
    exercises:[
      {key:"sustain_talk", title:"維持トークへの応答技法", desc:"増幅した聞き返し・両面を持った聞き返し・リフレーミングなどで維持トークに応答する練習"}
    ]
  },
  {
    id:"discord", group:"advanced", letter:"D", color:"spark",
    title:"バッティング練習（不協和）", tagline:"応用編 ・ Discord",
    exercises:[
      {key:"discord_batting", title:"不協和への対応 バッティング練習", desc:"感情の高ぶった発言に対し、共感・リフレーミング・自律性の強調などで応答する実践練習"}
    ]
  }
];

function findCategory(id){ return CATEGORIES.find(c=>c.id===id); }
function findExercise(catId, key){
  const cat = findCategory(catId);
  return cat ? cat.exercises.find(e=>e.key===key) : null;
}

/* ================= State ================= */
// view: {name:'home'} | {name:'category', catId} | {name:'exercise', catId, key} | {name:'chat', catId, key}
let state = {
  view: {name:"home"},
  messages: [], // {role:'user'|'assistant', content:string}
  loading: false,
  error: null
};

function setState(patch){
  state = {...state, ...patch};
  render();
}

/* ================= API ================= */
async function callClaude(systemPrompt, messages){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      system: systemPrompt,
      messages: messages
    })
  });
  if(!response.ok){
    throw new Error("APIリクエストに失敗しました（status "+response.status+"）");
  }
  const data = await response.json();
  const textBlock = (data.content || []).find(b=>b.type==="text");
  return textBlock ? textBlock.text : "";
}

async function startExercise(catId, key){
  const ex = findExercise(catId, key);
  if(!ex) return;
  setState({view:{name:"chat", catId, key}, messages:[], loading:true, error:null});
  try{
    const systemPrompt = EXERCISE_PROMPTS[key];
    const kickoff = [{role:"user", content:"（このエクササイズを開始してください）"}];
    const reply = await callClaude(systemPrompt, kickoff);
    setState({
      messages:[{role:"assistant", content:reply}],
      loading:false
    });
  }catch(e){
    setState({loading:false, error: e.message || String(e)});
  }
}

async function sendMessage(text){
  if(!text.trim() || state.loading) return;
  const {catId, key} = state.view;
  const newMessages = [...state.messages, {role:"user", content:text}];
  setState({messages:newMessages, loading:true, error:null});
  try{
    const systemPrompt = EXERCISE_PROMPTS[key];
    const reply = await callClaude(systemPrompt, newMessages);
    setState({messages:[...newMessages, {role:"assistant", content:reply}], loading:false});
  }catch(e){
    setState({loading:false, error: e.message || String(e)});
  }
}

/* ================= Rendering ================= */
function el(tag, attrs, children){
  const node = document.createElement(tag);
  if(attrs){
    for(const k in attrs){
      if(k === "class") node.className = attrs[k];
      else if(k === "html") node.innerHTML = attrs[k];
      else if(k.startsWith("on") && typeof attrs[k] === "function"){
        node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      } else {
        node.setAttribute(k, attrs[k]);
      }
    }
  }
  (children||[]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === "string") node.appendChild(document.createTextNode(c));
    else node.appendChild(c);
  });
  return node;
}

function renderHeader(){
  const wrap = el("div", {class:"app-header"});
  wrap.appendChild(el("div", {class:"eyebrow"}, ["MOTIVATIONAL INTERVIEWING PRACTICE"]));
  wrap.appendChild(el("h1", {class:"title"}, ["MIエクササイズ・ラボ"]));
  wrap.appendChild(el("p", {class:"subtitle"}, [
    "動機づけ面接（MI）の対話スキルを、AIを相手役にしたロールプレイで練習します。エクササイズを選ぶと、AIがトレーナーまたは患者役として対話をリードします。"
  ]));
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox","0 0 600 34");
  svg.setAttribute("class","wave");
  svg.setAttribute("preserveAspectRatio","none");
  const path = document.createElementNS(svgNS, "path");
  path.setAttribute("d","M0,17 Q25,2 50,17 T100,17 T150,17 T200,17 T250,17 T300,17 T350,17 T400,17 T450,17 T500,17 T550,17 T600,17");
  svg.appendChild(path);
  wrap.appendChild(svg);
  return wrap;
}

function badgeStyle(colorKey){
  const c = COLORS[colorKey];
  return "background:"+c.badge+";";
}
function tagStyle(colorKey){
  const c = COLORS[colorKey];
  return "background:"+c.tint+";color:"+c.text+";";
}

function renderHome(){
  const container = el("div", {});
  container.appendChild(renderHeader());

  const oars = CATEGORIES.filter(c=>c.group==="oars");
  const advanced = CATEGORIES.filter(c=>c.group==="advanced");

  const sec1 = el("div", {class:"section"});
  const head1 = el("div", {class:"section-head"});
  head1.appendChild(el("h2", {}, ["基礎スキル（OARS）"]));
  head1.appendChild(el("span", {class:"count"}, [oars.length + "カテゴリー"]));
  sec1.appendChild(head1);
  const grid1 = el("div", {class:"grid"});
  oars.forEach(cat=>grid1.appendChild(renderCategoryCard(cat)));
  sec1.appendChild(grid1);
  container.appendChild(sec1);

  const sec2 = el("div", {class:"section"});
  const head2 = el("div", {class:"section-head"});
  head2.appendChild(el("h2", {}, ["応用編"]));
  head2.appendChild(el("span", {class:"count"}, [advanced.length + "カテゴリー"]));
  sec2.appendChild(head2);
  const grid2 = el("div", {class:"grid"});
  advanced.forEach(cat=>grid2.appendChild(renderCategoryCard(cat)));
  sec2.appendChild(grid2);
  container.appendChild(sec2);

  container.appendChild(el("div", {class:"footer-note"}, [
    "各エクササイズはAIとの1対1のロールプレイです。実際の臨床場面ではなく練習用の会話としてご利用ください。"
  ]));

  return container;
}

function renderCategoryCard(cat){
  const card = el("div", {class:"card", tabindex:"0", role:"button",
    onClick:()=>setState({view:{name:"category", catId:cat.id}})});
  const top = el("div", {class:"card-top"});
  top.appendChild(el("div", {class:"badge", style:badgeStyle(cat.color)}, [cat.letter]));
  const titleWrap = el("div", {});
  titleWrap.appendChild(el("div", {class:"card-title"}, [cat.title]));
  titleWrap.appendChild(el("div", {class:"card-meta"}, [cat.tagline]));
  top.appendChild(titleWrap);
  card.appendChild(top);
  card.appendChild(el("p", {class:"card-sub"}, [
    cat.exercises.length===1 ? cat.exercises[0].desc : cat.exercises.length + "種類の練習を収録"
  ]));
  return card;
}

function renderCategoryView(catId){
  const cat = findCategory(catId);
  const container = el("div", {});
  container.appendChild(el("button", {class:"back-link", onClick:()=>setState({view:{name:"home"}})}, ["← メニューに戻る"]));

  const head = el("div", {style:"display:flex;align-items:center;gap:12px;margin-bottom:6px;"});
  head.appendChild(el("div", {class:"badge", style:badgeStyle(cat.color)+"width:34px;height:34px;font-size:14px;"}, [cat.letter]));
  head.appendChild(el("h2", {style:"font-family:var(--serif);font-size:22px;margin:0;color:var(--teal-deep);"}, [cat.title]));
  container.appendChild(head);
  container.appendChild(el("p", {class:"subtitle", style:"margin-bottom:20px;"}, [cat.tagline]));

  if(cat.exercises.length === 1){
    container.appendChild(renderExerciseDetail(cat.id, cat.exercises[0].key));
  } else {
    const list = el("div", {class:"ex-list"});
    cat.exercises.forEach(ex=>{
      const item = el("div", {class:"ex-item", tabindex:"0", role:"button",
        onClick:()=>setState({view:{name:"exercise", catId:cat.id, key:ex.key}})});
      const left = el("div", {});
      left.appendChild(el("div", {class:"ex-item-title"}, [ex.title]));
      left.appendChild(el("div", {class:"ex-item-desc"}, [ex.desc]));
      item.appendChild(left);
      item.appendChild(el("div", {class:"ex-item-arrow"}, ["›"]));
      list.appendChild(item);
    });
    container.appendChild(list);
  }
  return container;
}

function renderExerciseView(catId, key){
  const container = el("div", {});
  const cat = findCategory(catId);
  container.appendChild(el("button", {class:"back-link",
    onClick:()=> cat.exercises.length===1 ? setState({view:{name:"home"}}) : setState({view:{name:"category", catId}})
  }, ["← " + (cat.exercises.length===1 ? "メニューに戻る" : cat.title + "の一覧に戻る")]));
  container.appendChild(renderExerciseDetail(catId, key));
  return container;
}

function renderExerciseDetail(catId, key){
  const cat = findCategory(catId);
  const ex = findExercise(catId, key);
  const card = el("div", {class:"detail-card"});
  card.appendChild(el("span", {class:"detail-tag", style:tagStyle(cat.color)}, [cat.title]));
  card.appendChild(el("h3", {class:"detail-title"}, [ex.title]));
  card.appendChild(el("p", {class:"detail-desc"}, [ex.desc]));

  const howtoBox = el("div", {class:"howto-box"});
  howtoBox.appendChild(el("div", {class:"howto-label"}, ["あなたがすること"]));
  howtoBox.appendChild(el("p", {class:"howto-text"}, [HOWTO_TEXT[key]]));
  card.appendChild(howtoBox);

  card.appendChild(el("button", {class:"start-btn", onClick:()=>startExercise(catId, key)}, ["このエクササイズを始める"]));
  return card;
}

function renderChatView(catId, key){
  const cat = findCategory(catId);
  const ex = findExercise(catId, key);
  const container = el("div", {});

  const backBtn = el("button", {class:"back-link", onClick:()=>{
    if(cat.exercises.length===1) setState({view:{name:"home"}, messages:[], error:null});
    else setState({view:{name:"category", catId}, messages:[], error:null});
  }}, ["← 終了してメニューへ戻る"]);
  container.appendChild(backBtn);

  const header = el("div", {class:"chat-header"});
  const titleWrap = el("div", {class:"chat-title-wrap"});
  titleWrap.appendChild(el("span", {class:"detail-tag", style:tagStyle(cat.color)}, [cat.title]));
  titleWrap.appendChild(el("h3", {class:"chat-title"}, [ex.title]));
  header.appendChild(titleWrap);
  container.appendChild(header);

  const howtoStrip = el("div", {class:"howto-strip"});
  howtoStrip.appendChild(el("span", {class:"howto-strip-label"}, ["あなたがすること："]));
  howtoStrip.appendChild(el("span", {}, [HOWTO_TEXT[key]]));
  container.appendChild(howtoStrip);

  const chatWindow = el("div", {class:"chat-window", id:"chat-window"});
  if(state.messages.length === 0 && !state.loading){
    chatWindow.appendChild(el("div", {class:"empty-hint"}, ["準備中です…"]));
  }
  state.messages.forEach(m=>{
    chatWindow.appendChild(el("div", {class:"msg " + m.role}, [m.content]));
  });
  if(state.loading){
    chatWindow.appendChild(el("div", {class:"msg typing"}, ["応答を作成しています…"]));
  }
  container.appendChild(chatWindow);

  if(state.error){
    container.appendChild(el("div", {class:"error-box"}, ["エラーが発生しました: " + state.error]));
  }

  const composer = el("div", {class:"composer"});
  const textarea = el("textarea", {
    id:"composer-input",
    placeholder: state.loading ? "応答を待っています…" : "ここに入力してEnterで送信（Shift+Enterで改行）",
  });
  if(state.loading) textarea.setAttribute("disabled","true");
  textarea.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      const val = textarea.value;
      textarea.value = "";
      sendMessage(val);
    }
  });
  composer.appendChild(textarea);

  const sendBtn = el("button", {class:"send-btn", onClick:()=>{
    const ta = document.getElementById("composer-input");
    const val = ta.value;
    ta.value = "";
    sendMessage(val);
  }}, ["送信"]);
  if(state.loading) sendBtn.setAttribute("disabled","true");
  composer.appendChild(sendBtn);

  container.appendChild(composer);
  return container;
}

function render(){
  const root = document.getElementById("root");
  root.innerHTML = "";
  let view;
  switch(state.view.name){
    case "category":
      view = renderCategoryView(state.view.catId);
      break;
    case "exercise":
      view = renderExerciseView(state.view.catId, state.view.key);
      break;
    case "chat":
      view = renderChatView(state.view.catId, state.view.key);
      break;
    default:
      view = renderHome();
  }
  root.appendChild(view);

  // autoscroll chat + refocus input
  const cw = document.getElementById("chat-window");
  if(cw){ cw.scrollTop = cw.scrollHeight; }
  const inp = document.getElementById("composer-input");
  if(inp && !state.loading){ inp.focus(); }
}

render();
</script>
